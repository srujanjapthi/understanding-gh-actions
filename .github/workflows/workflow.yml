name: My first workflow
on: [push, workflow_dispatch]
jobs:
  my-first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all files
        run: ls -a
      - name: Print working directory
        run: pwd
      - name: Create a JS File
        run: echo 'console.log("Hello World!")' > app.js
      - name: List all files
        run: ls -a
      - name: Execute JS File
        run: node app.js
  system-info:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Runner System
        run: |
          hostnamectl
          lscpu
          free -h
          df -h
          lsblk
          whoami
          hostname -I
          top
          uptime
