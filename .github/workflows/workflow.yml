name: My first workflow
on: push
jobs:
  my-first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all files
        run: ls -a
      - name: Print working directory
        run: pwd
      - name: Create a JS File
        run: echo 'console.log("Hello World!")' > app.js
      - name: List all files
        run: ls -a
      - name: Execute JS File
        run: node app.js
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Runner System
        run: |
          echo "OS information"
          hostnamectl

          echo "CPU information"
          lscpu

          echo "RAM information"
          free -h

          echo "Disk information"
          df -h

          echo "Disk partitions"
          lsblk

          echo "Current user"
          whoami

          echo "IP addresses"
          hostname -I

          echo "Running processes"
          ps aux --sort=-%cpu | head -15

          echo "Uptime and load"
          uptime
